### model
model_name_or_path: /home/sean/Documents/ktransformers/deepseek-ai/DeepSeek-V2-Lite-Chat
trust_remote_code: true

# Memory management for OOM prevention
low_cpu_mem_usage: true  # Enable efficient CPU memory usage during model loading (experimental with ZeRO-3)
offload_folder: /tmp/hf_offload  # Temporary folder for CPU offloading
# Note: device_map is set automatically by LLaMA-Factory during training
# EXPERIMENTAL: Patch applied to allow low_cpu_mem_usage with ZeRO-3
# This may allow model to load to CPU before DeepSpeed takes over

# NO quantization - using full precision with ZeRO-3 CPU offload
# quantization_bit: 4  # DISABLED - using full precision with ZeRO-3 CPU offload
# quantization_type: nf4  # DISABLED - using full precision with ZeRO-3 CPU offload

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: ""  # Must be provided via --dataset flag when running training script
template: deepseek
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 8

### output
output_dir: saves/Kllama_deepseekV2Lite_hf_trained
logging_steps: 1
save_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 1  # Further reduced to avoid OOM during model loading
gradient_accumulation_steps: 32  # Increased to maintain effective batch size = 1*32=32
learning_rate: 5.0e-5
num_train_epochs: 4.0
lr_scheduler_type: linear
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
gradient_checkpointing: true  # Enable gradient checkpointing to save memory

# DeepSpeed ZeRO-3 with Hybrid Offload (Parameters on GPU, Optimizer on CPU)
# This keeps model parameters on GPU (fast) while offloading optimizer states to CPU (saves memory)
# Enables full-precision training with balanced speed and memory usage
# GPU VRAM during training: ~3-5 GB (LoRA training)
# CPU RAM: ~28-35 GB (base model + LoRA optimizer)
# Performance: ~20-30% faster than full CPU offload
deepspeed: examples/deepspeed/ds_z3_hybrid_config.json

### HuggingFace backend (no use_kt)
# When use_kt is not set or false, LLaMA-Factory uses standard HuggingFace PEFT
# This will produce adapters in standard HuggingFace format (no conversion needed!)

### eval
eval_dataset: ""  # Will be set automatically to match dataset when --dataset is provided
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10

