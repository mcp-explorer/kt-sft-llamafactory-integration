### model
model_name_or_path: /home/sean/Documents/ktransformers/deepseek-ai/DeepSeek-V2-Lite-Chat
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: identity_sean  # Identity + Current Date instruction following
template: deepseek
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16  # Increased from 4 to use more CPU cores for data preprocessing
dataloader_num_workers: 8  # Increased from 2 to prefetch more batches in parallel

### output
output_dir: saves/Kllama_deepseekV2Lite
logging_steps: 1  # Log to wandb at every step
save_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 32  # Uses ~10GB VRAM, fits in 16GB GPU
gradient_accumulation_steps: 1  # Effective batch size = 32*1=32 (gives ~68 steps in 40 epochs)
learning_rate: 5.0e-3  # Higher LR needed for model to actually learn
num_train_epochs: 40.0  # 40 epochs gives ~68 steps (sufficient for learning with small dataset)
lr_scheduler_type: linear  # Linear decay better for short training than cosine
warmup_ratio: 0.03  # Reduced warmup means more training at full LR
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### ktransformers
use_kt: true
kt_optimize_rule: ../kt-sft/ktransformers/optimize/optimize_rules/DeepSeek-V2-Lite-Chat-sft.yaml
cpu_infer: 32  # Increased from 16 to use more CPU cores for computation
chunk_size: 4096  # Reduced from 16384 - for SFT with cutoff_len=2048, smaller chunk_size is sufficient and uses less memory

### eval
eval_dataset: identity_sean  # Use same dataset to verify identity learning (cannot use val_size with eval_dataset)
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 17  # Evaluate every 17 steps (~4 times during training, adjusted for ~68 total steps)
