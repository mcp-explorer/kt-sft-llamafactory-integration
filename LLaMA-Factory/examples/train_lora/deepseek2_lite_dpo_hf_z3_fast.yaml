### model
model_name_or_path: /home/sean/Documents/ktransformers/deepseek-ai/DeepSeek-V2-Lite-Chat
trust_remote_code: true
low_cpu_mem_usage: true
offload_folder: /tmp/hf_offload

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 32
lora_target: all
lora_dropout: 0.1
lora_alpha: 64
pref_beta: 0.1
pref_loss: sigmoid  # choices: [sigmoid (dpo), orpo, simpo]

### dataset
dataset: identity_sean_dpo_improved
template: deepseek
cutoff_len: 2048
max_samples: 500
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 16  # Increased for faster data loading

### output
output_dir: saves/Kllama_deepseekV2Lite_hf_z3_dpo_fast
logging_steps: 1
save_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 5.0e-6  # Lower LR for DPO (typically 1e-6 to 1e-5)
num_train_epochs: 3.0  # Reduced from 10.0 - DPO typically needs 1-3 epochs
resume_from_checkpoint: null
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true  # Keep enabled due to high GPU memory usage (92%)
weight_decay: 0.01
max_grad_norm: 1.0
# Try GPU-only DeepSpeed for 2-4x speedup (test memory first!)
# If OOM, fall back to ds_z3_hybrid_config.json
deepspeed: examples/deepspeed/ds_z3_gpu_config.json  # GPU-only (faster than hybrid)

