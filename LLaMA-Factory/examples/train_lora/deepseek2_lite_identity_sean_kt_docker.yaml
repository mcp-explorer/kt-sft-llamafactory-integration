### model
model_name_or_path: /workspace/models/deepseek-ai/DeepSeek-V2-Lite-Chat
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: identity_sean_generated
template: deepseek
cutoff_len: 512
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: /workspace/saves/deepseek2_lite_identity_sean_kt
logging_steps: 1
save_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
max_steps: 5

### ktransformers - CPU offload for full precision training
use_kt: true
kt_optimize_rule: /workspace/ktransformers/kt-sft/ktransformers/optimize/optimize_rules/DeepSeek-V2-Lite-Chat-sft.yaml
cpu_infer: 32
chunk_size: 4096

### eval - disabled to prevent OOM
eval_strategy: "no"
