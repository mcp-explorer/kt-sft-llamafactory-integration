### model
model_name_or_path: /home/sean/Documents/ktransformers/deepseek-ai/DeepSeek-V2-Lite-Chat
trust_remote_code: true
low_cpu_mem_usage: true
offload_folder: /tmp/hf_offload

### method
stage: dpo  # Uses DPO stage with ORPO loss
do_train: true
finetuning_type: lora
lora_rank: 32
lora_target: all
lora_dropout: 0.1
lora_alpha: 64
pref_beta: 0.1  # Weight of odds ratio loss vs SFT loss
pref_loss: orpo  # ORPO loss (no reference model needed)

### dataset
dataset: identity_sean_dpo_improved
template: deepseek
cutoff_len: 2048
max_samples: 500
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 16

### output
output_dir: saves/Kllama_deepseekV2Lite_hf_z3_orpo
logging_steps: 1
save_steps: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 5.0e-6
num_train_epochs: 3.0
resume_from_checkpoint: null
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
gradient_checkpointing: true
weight_decay: 0.01
max_grad_norm: 1.0
deepspeed: examples/deepspeed/ds_z3_hybrid_config.json
